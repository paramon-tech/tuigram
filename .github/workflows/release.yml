name: Draft release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.x
          check-latest: true
      - name: Verify release sources
        run: |
          go mod verify
          go vet ./...
          go test -race ./...
          make smoke
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  package:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, freebsd, openbsd, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.x
          check-latest: true
      - name: Package release binary
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
        run: bash scripts/package.sh "$TARGET_OS" "$TARGET_ARCH" "$RELEASE_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  draft:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create checksums and draft release
        shell: bash
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          archives=(tuigram_*.tar.gz)
          [[ ${#archives[@]} -eq 8 ]]
          sha256sum "${archives[@]}" > SHA256SUMS
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" != true ]]; then
              echo "Refusing to replace assets of an already published release." >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "${archives[@]}" SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" "${archives[@]}" SHA256SUMS \
              --draft --verify-tag --generate-notes --title "Tuigram $RELEASE_TAG"
          fi
